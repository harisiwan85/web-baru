name: noVNC

on:
  workflow_dispatch:

jobs:
  secure-novnc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # 1. CREATE WINDOWS USER
      # ============================================================
      - name: Create VNC User
        shell: powershell
        run: |

          $username = "VNC"
          $password = "Password123"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {

              Write-Host "User already exists."
              Write-Host "Resetting password..."

              Set-LocalUser `
                -Name $username `
                -Password $securePassword

          }
          else {

              Write-Host "Creating VNC user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          # Administrator
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "VNC USER READY"
          Write-Host "Username : $username"
          Write-Host "Password : $password"


      # ============================================================
      # 2. INSTALL TIGHTVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |

          $url = "https://www.tightvnc.com/download/2.8.88/tightvnc-2.8.88-gpl-setup-64bit.msi"

          $installer = "$env:TEMP\tightvnc.msi"

          Write-Host "Downloading TightVNC..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {

              Write-Error "TightVNC installer was not downloaded."
              exit 1
          }

          Write-Host "Installing TightVNC..."

          $arguments = @(
              "/i"
              "`"$installer`""
              "/quiet"
              "/norestart"

              "SET_USEVNCAUTHENTICATION=1"
              "VALUE_OF_USEVNCAUTHENTICATION=1"

              "SET_PASSWORD=1"
              "VALUE_OF_PASSWORD=Password123"

              "SET_USECONTROLAUTHENTICATION=1"
              "VALUE_OF_USECONTROLAUTHENTICATION=1"

              "SET_CONTROLPASSWORD=1"
              "VALUE_OF_CONTROLPASSWORD=Password123"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {

              Write-Error "TightVNC installation failed."
              exit 1
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "TightVNC installed."


      # ============================================================
      # 3. FIND TIGHTVNC
      # ============================================================
      - name: Locate TightVNC
        shell: powershell
        run: |

          $paths = @(
              "${env:ProgramFiles}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe"
          )

          $tvnserver = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {

                  $tvnserver = $path
                  break
              }
          }

          if (-not $tvnserver) {

              Write-Error "tvnserver.exe was not found."
              exit 1
          }

          Write-Host "TightVNC executable:"
          Write-Host $tvnserver

          echo "TVNSERVER=$tvnserver" >> $env:GITHUB_ENV


      # ============================================================
      # 4. START TIGHTVNC
      # ============================================================
      - name: Start VNC Server
        shell: powershell
        run: |

          Write-Host "Checking TightVNC service..."

          $service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Write-Host "Service found."
              Write-Host "Current status: $($service.Status)"

              if ($service.Status -ne "Running") {

                  Write-Host "Starting TightVNC service..."

                  Start-Service `
                    -Name "tvnserver" `
                    -ErrorAction Stop

                  Start-Sleep 5
              }

          }
          else {

              Write-Host "TightVNC service not found."
              Write-Host "Starting tvnserver directly..."

              Start-Process `
                -FilePath "$env:TVNSERVER" `
                -WindowStyle Hidden

              Start-Sleep 5
          }

          Write-Host "TightVNC started."


      # ============================================================
      # 5. VERIFY VNC PORT
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |

          Write-Host "Checking VNC port 5900..."

          $result = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "========================================"
              Write-Host "VNC PORT 5900 IS NOT AVAILABLE"
              Write-Host "========================================"

              Get-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host "VNC port 5900 OK."


      # ============================================================
      # 6. SETUP PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 7. INSTALL WEBSOCKIFY
      # ============================================================
      - name: Install Websockify
        shell: powershell
        run: |

          Write-Host "Installing websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Websockify installation failed."
              exit 1
          }

          Write-Host "Websockify installed."


      # ============================================================
      # 8. DOWNLOAD NOVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |

          $noVNC = "C:\noVNC"

          if (Test-Path $noVNC) {

              Remove-Item `
                $noVNC `
                -Recurse `
                -Force
          }

          Write-Host "Downloading noVNC..."

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $noVNC

          if (-not (Test-Path "$noVNC\vnc.html")) {

              Write-Error "noVNC installation failed."
              exit 1
          }

          Write-Host "noVNC installed."


      # ============================================================
      # 9. CONFIGURE FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: powershell
        run: |

          Write-Host "Configuring firewall..."

          netsh advfirewall firewall delete rule `
            name="VNC-Tailscale" `
            2>$null

          netsh advfirewall firewall delete rule `
            name="noVNC-Tailscale" `
            2>$null

          # VNC
          netsh advfirewall firewall add rule `
            name="VNC-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=5900

          # noVNC
          netsh advfirewall firewall add rule `
            name="noVNC-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=6080

          Write-Host "Firewall configured."


      # ============================================================
      # 10. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList @(
              "/i"
              "`"$installer`""
              "/quiet"
              "/norestart"
            ) `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {

              Write-Error "Tailscale installation failed."
              exit 1
          }

          echo "TAILSCALE=$tailscale" >> $env:GITHUB_ENV

          Write-Host "Tailscale installed."


      # ============================================================
      # 11. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

        run: |

          $tailscale = "$env:TAILSCALE"

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-novnc-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {

              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {

              $tsIP = (
                & $tailscale ip -4 2>$null |
                Select-Object -First 1
              ).Trim()

              if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') {

                  break
              }

              Start-Sleep 3
          }

          if (-not $tsIP) {

              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "========================================"
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "IP: $tsIP"
          Write-Host "========================================"


      # ============================================================
      # 12. START NOVNC / WEBSOCKIFY
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |

          $noVNC = "C:\noVNC"

          $logFile = "$noVNC\websockify.log"
          $errorFile = "$noVNC\websockify-error.log"

          Write-Host "Starting noVNC..."

          # Remove old logs
          Remove-Item `
            $logFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $errorFile `
            -Force `
            -ErrorAction SilentlyContinue

          # Kill previous websockify processes
          Get-CimInstance Win32_Process |
            Where-Object {
              $_.CommandLine -match "websockify"
            } |
            ForEach-Object {

              Write-Host "Stopping old websockify PID $($_.ProcessId)"

              Stop-Process `
                -Id $_.ProcessId `
                -Force `
                -ErrorAction SilentlyContinue
            }

          Start-Sleep 2

          Write-Host "Launching websockify..."

          $command = @"
cd /d C:\noVNC
python -m websockify --web=C:\noVNC 0.0.0.0:6080 127.0.0.1:5900 > "$logFile" 2> "$errorFile"
"@

          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", $command `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "websockify PID: $($process.Id)"

          Start-Sleep 10

          $port = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $port) {

              Write-Host ""
              Write-Host "========================================"
              Write-Host "NOVNC FAILED TO START"
              Write-Host "========================================"

              if (Test-Path $logFile) {

                  Write-Host ""
                  Write-Host "===== WEBSOCKIFY LOG ====="
                  Get-Content $logFile
              }

              if (Test-Path $errorFile) {

                  Write-Host ""
                  Write-Host "===== WEBSOCKIFY ERROR ====="
                  Get-Content $errorFile
              }

              exit 1
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NOVNC RUNNING"
          Write-Host "PORT: 6080"
          Write-Host "========================================"


      # ============================================================
      # 13. DISPLAY CONNECTION INFORMATION
      # ============================================================
      - name: Display Connection Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "          NOVNC READY"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"

          Write-Host ""

          Write-Host "Browser URL:"
          Write-Host "http://$env:TAILSCALE_IP:6080/vnc.html"

          Write-Host ""

          Write-Host "VNC Server:"
          Write-Host "$env:TAILSCALE_IP`:5900"

          Write-Host ""

          Write-Host "VNC Password:"
          Write-Host "Password123"

          Write-Host ""

          Write-Host "========================================"


      # ============================================================
      # 14. MAINTAIN CONNECTION
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "       NOVNC SESSION ACTIVE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host "http://$env:TAILSCALE_IP:6080/vnc.html"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "VNC"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "Password123"
          Write-Host ""
          Write-Host "========================================"

          while ($true) {

              # ==================================================
              # CHECK TAILSCALE
              # ==================================================

              $tsStatus = & "$env:TAILSCALE" status 2>$null

              if ($LASTEXITCODE -ne 0) {

                  Write-Host "WARNING: Tailscale status check failed."
              }


              # ==================================================
              # CHECK VNC 5900
              # ==================================================

              $vncPort = Get-NetTCPConnection `
                -LocalPort 5900 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $vncPort) {

                  Write-Host ""
                  Write-Host "VNC 5900 is NOT listening."

                  $service = Get-Service `
                    -Name "tvnserver" `
                    -ErrorAction SilentlyContinue

                  if ($service) {

                      Write-Host "TightVNC status: $($service.Status)"

                      if ($service.Status -ne "Running") {

                          Write-Host "Starting TightVNC..."

                          Start-Service `
                            -Name "tvnserver" `
                            -ErrorAction SilentlyContinue

                          Start-Sleep 5
                      }
                  }
              }


              # ==================================================
              # CHECK NOVNC 6080
              # ==================================================

              $novncPort = Get-NetTCPConnection `
                -LocalPort 6080 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $novncPort) {

                  Write-Host ""
                  Write-Host "========================================"
                  Write-Host "noVNC STOPPED"
                  Write-Host "RESTARTING..."
                  Write-Host "========================================"

                  # Show previous error
                  if (Test-Path "C:\noVNC\websockify-error.log") {

                      Write-Host ""
                      Write-Host "===== PREVIOUS ERROR ====="

                      Get-Content `
                        "C:\noVNC\websockify-error.log" `
                        -Tail 30
                  }

                  # Kill old websockify
                  Get-CimInstance Win32_Process |
                    Where-Object {
                      $_.CommandLine -match "websockify"
                    } |
                    ForEach-Object {

                      Write-Host "Stopping websockify PID $($_.ProcessId)"

                      Stop-Process `
                        -Id $_.ProcessId `
                        -Force `
                        -ErrorAction SilentlyContinue
                    }

                  Start-Sleep 2

                  # Start again
                  $command = @"
cd /d C:\noVNC
python -m websockify --web=C:\noVNC 0.0.0.0:6080 127.0.0.1:5900
"@

                  Start-Process `
                    -FilePath "cmd.exe" `
                    -ArgumentList "/c", $command `
                    -WindowStyle Hidden

                  Start-Sleep 10

                  # Check again
                  $novncPort = Get-NetTCPConnection `
                    -LocalPort 6080 `
                    -State Listen `
                    -ErrorAction SilentlyContinue

                  if ($novncPort) {

                      Write-Host ""
                      Write-Host "noVNC successfully restarted."

                  }
                  else {

                      Write-Host ""
                      Write-Host "WARNING: noVNC failed to restart."

                      if (Test-Path "C:\noVNC\websockify-error.log") {

                          Write-Host ""
                          Write-Host "===== NOVNC ERROR ====="

                          Get-Content `
                            "C:\noVNC\websockify-error.log" `
                            -Tail 50
                      }
                  }

              }
              else {

                  Write-Host `
                    "$(Get-Date -Format 'HH:mm:ss') - noVNC OK :6080"
              }


              # ==================================================
              # WAIT
              # ==================================================

              Start-Sleep 60
          }

name: noVNC

on:
  workflow_dispatch:

jobs:
  novnc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. INSTALL TIGHTVNC
      # ==========================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          $file = "$env:TEMP\tightvnc.msi"

          Write-Host "Downloading TightVNC..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          if (-not (Test-Path $file)) {
              Write-Error "TightVNC download failed."
              exit 1
          }

          Write-Host "Installing TightVNC..."

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($p.ExitCode)"

          if ($p.ExitCode -ne 0) {
              Write-Error "TightVNC installation failed."
              exit 1
          }

          Remove-Item $file -Force

          Write-Host "TightVNC installed."


      # ==========================================
      # 2. START VNC
      # ==========================================
      - name: Start VNC
        shell: powershell
        run: |

          Write-Host "Searching for TightVNC..."

          $paths = @(
              "${env:ProgramFiles}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe"
          )

          $tvn = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $tvn = $path
                  break
              }
          }

          if (-not $tvn) {
              Write-Error "tvnserver.exe not found."
              exit 1
          }

          Write-Host "TightVNC:"
          Write-Host $tvn

          # Start VNC
          Start-Process `
            -FilePath $tvn `
            -WindowStyle Hidden

          Start-Sleep 8

          Write-Host "Checking port 5900..."

          $vnc = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $vnc) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "VNC IS NOT LISTENING"
              Write-Host "======================================"

              Get-Process `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host "VNC port 5900 OK."


      # ==========================================
      # 3. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $file = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $file

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$file`" /quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($p.ExitCode)"

          Remove-Item $file -Force

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              Write-Error "tailscale.exe not found."
              exit 1
          }

          echo "TAILSCALE=$ts" >> $env:GITHUB_ENV

          Write-Host "Tailscale installed."


      # ==========================================
      # 4. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          Write-Host "Connecting Tailscale..."

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-novnc-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale up failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale..."

          $ip = $null

          for ($i = 1; $i -le 30; $i++) {

              $output = & $ts ip -4 2>$null

              Write-Host "Attempt $i : $output"

              foreach ($line in $output) {

                  $line = $line.Trim()

                  if ($line -match '^100\.\d+\.\d+\.\d+$') {
                      $ip = $line
                      break
                  }
              }

              if ($ip) {
                  break
              }

              Start-Sleep 2
          }

          if (-not $ip) {

              Write-Host ""
              Write-Host "Tailscale status:"
              & $ts status

              Write-Error "Could not obtain Tailscale IPv4 address."
              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "TAILSCALE IP"
          Write-Host "$ip"
          Write-Host "======================================"

          # IMPORTANT:
          # Persist the IP for subsequent steps
          "TAILSCALE_IP=$ip" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==========================================
      # 5. FIREWALL
      # ==========================================
      - name: Configure Firewall
        shell: powershell
        run: |

          Write-Host "Configuring firewall..."

          netsh advfirewall firewall delete rule `
            name="noVNC" `
            2>$null

          netsh advfirewall firewall add rule `
            name="noVNC" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=6080

          Write-Host "Firewall rule created."


      # ==========================================
      # 6. INSTALL PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 7. INSTALL NOVNC
      # ==========================================
      - name: Install noVNC
        shell: powershell
        run: |

          $path = "C:\noVNC"

          if (Test-Path $path) {
              Remove-Item `
                $path `
                -Recurse `
                -Force
          }

          Write-Host "Cloning noVNC..."

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $path

          if (-not (Test-Path "$path\vnc.html")) {
              Write-Error "noVNC was not downloaded correctly."
              exit 1
          }

          Write-Host "noVNC OK."


      # ==========================================
      # 8. INSTALL WEBSOCKIFY
      # ==========================================
      - name: Install Websockify
        shell: powershell
        run: |

          python -m pip install --upgrade pip
          python -m pip install websockify

          if ($LASTEXITCODE -ne 0) {
              Write-Error "websockify installation failed."
              exit 1
          }

          Write-Host "websockify OK."


      # ==========================================
      # 9. START NOVNC
      # ==========================================
      - name: Start noVNC
        shell: powershell
        run: |

          $log = "C:\noVNC\novnc.log"
          $error = "C:\noVNC\novnc-error.log"

          Remove-Item `
            $log `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $error `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "Starting websockify..."

          $process = Start-Process `
            -FilePath "python.exe" `
            -ArgumentList @(
                "-m"
                "websockify"
                "--web=C:\noVNC"
                "0.0.0.0:6080"
                "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput $log `
            -RedirectStandardError $error `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "Websockify PID: $($process.Id)"

          Start-Sleep 10

          # Check process
          $running = Get-Process `
            -Id $process.Id `
            -ErrorAction SilentlyContinue

          if (-not $running) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "WEBSOCKIFY PROCESS DIED"
              Write-Host "======================================"

              if (Test-Path $error) {
                  Get-Content $error
              }

              exit 1
          }

          # Check port
          $port = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $port) {

              Write-Host ""
              Write-Host "======================================"
              Write-Host "PORT 6080 NOT LISTENING"
              Write-Host "======================================"

              Write-Host ""
              Write-Host "ERROR LOG:"

              if (Test-Path $error) {
                  Get-Content $error
              }

              Write-Host ""
              Write-Host "OUTPUT LOG:"

              if (Test-Path $log) {
                  Get-Content $log
              }

              exit 1
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "NOVNC IS RUNNING"
          Write-Host "PORT 6080 OK"
          Write-Host "======================================"


      # ==========================================
      # 10. SHOW CONNECTION
      # ==========================================
      - name: Show Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              NOVNC READY"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "Browser:"
          Write-Host "http://$env:TAILSCALE_IP`:6080/vnc.html"
          Write-Host ""
          Write-Host "VNC:"
          Write-Host "$env:TAILSCALE_IP`:5900"
          Write-Host ""
          Write-Host "=========================================="


      # ==========================================
      # 11. MAINTAIN CONNECTION
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          NOVNC SESSION ACTIVE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "URL:"
          Write-Host "http://$env:TAILSCALE_IP`:6080/vnc.html"
          Write-Host ""
          Write-Host "Tailscale:"
          Write-Host "$env:TAILSCALE_IP"
          Write-Host ""
          Write-Host "=========================================="

          while ($true) {

              # ------------------------------------------
              # TAILSCALE
              # ------------------------------------------

              $ts = & "$env:TAILSCALE" ip -4 2>$null

              Write-Host ""
              Write-Host "$(Get-Date -Format 'HH:mm:ss') - Tailscale: $ts"


              # ------------------------------------------
              # VNC
              # ------------------------------------------

              $vnc = Get-NetTCPConnection `
                -LocalPort 5900 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($vnc) {
                  Write-Host "VNC :5900 OK"
              }
              else {
                  Write-Host "WARNING: VNC :5900 NOT LISTENING"
              }


              # ------------------------------------------
              # NOVNC
              # ------------------------------------------

              $novnc = Get-NetTCPConnection `
                -LocalPort 6080 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($novnc) {
                  Write-Host "noVNC :6080 OK"
              }
              else {
                  Write-Host "WARNING: noVNC :6080 NOT LISTENING"

                  if (Test-Path "C:\noVNC\novnc-error.log") {
                      Write-Host "===== noVNC ERROR ====="
                      Get-Content `
                        "C:\noVNC\novnc-error.log" `
                        -Tail 20
                  }
              }

              Start-Sleep 60
          }

name: noVNC

on:
  workflow_dispatch:

jobs:
  novnc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. INSTALL TIGHTVNC
      # ==========================================
      - name: Install TightVNC
        shell: powershell
        run: |
          $url = "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-gpl-setup-64bit.msi"
          $installer = "$env:TEMP\tightvnc.msi"

          Write-Host "Downloading TightVNC..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
              Write-Error "TightVNC download failed."
              exit 1
          }

          Write-Host "Installing TightVNC..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Error "TightVNC installation failed."
              exit 1
          }

          Remove-Item $installer -Force

          Write-Host "TightVNC installed successfully."


      # ==========================================
      # 2. START TIGHTVNC
      # ==========================================
      - name: Start VNC
        shell: powershell
        run: |

          Write-Host "Searching for TightVNC..."

          $paths = @(
              "${env:ProgramFiles}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe"
          )

          $tvnserver = $null

          foreach ($path in $paths) {

              if (Test-Path $path) {
                  $tvnserver = $path
                  break
              }
          }

          if (-not $tvnserver) {
              Write-Error "tvnserver.exe not found."
              exit 1
          }

          Write-Host "TightVNC found:"
          Write-Host $tvnserver

          Write-Host "Starting TightVNC..."

          Start-Process `
            -FilePath $tvnserver `
            -WindowStyle Hidden

          Start-Sleep 8

          Write-Host "Checking VNC port 5900..."

          $vncPort = Get-NetTCPConnection `
            -LocalPort 5900 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $vncPort) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "VNC PORT 5900 IS NOT LISTENING"
              Write-Host "=========================================="

              Get-Process `
                -Name tvnserver `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host "VNC port 5900 is OK."


      # ==========================================
      # 3. CONFIGURE FIREWALL
      # ==========================================
      - name: Configure Firewall
        shell: powershell
        run: |

          Write-Host "Configuring firewall..."

          netsh advfirewall firewall delete rule `
            name="noVNC" `
            2>$null

          netsh advfirewall firewall add rule `
            name="noVNC" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=6080

          Write-Host "Firewall configured."


      # ==========================================
      # 4. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
              Write-Error "Tailscale download failed."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Remove-Item $installer -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "tailscale.exe not found."
              exit 1
          }

          "TAILSCALE=$tailscale" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Tailscale installed successfully."


      # ==========================================
      # 5. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is empty."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-novnc-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          Write-Host ""
          Write-Host "Waiting for Tailscale IPv4..."

          $tailscaleIP = $null

          for ($i = 1; $i -le 30; $i++) {

              Write-Host "Attempt $i..."

              $addresses = & $tailscale ip -4 2>$null

              foreach ($address in $addresses) {

                  $address = $address.Trim()

                  if ($address -match '^100\.\d+\.\d+\.\d+$') {

                      $tailscaleIP = $address
                      break
                  }
              }

              if ($tailscaleIP) {
                  break
              }

              Start-Sleep 2
          }

          if (-not $tailscaleIP) {

              Write-Host ""
              Write-Host "Tailscale status:"
              & $tailscale status

              Write-Error "Tailscale IPv4 address was not found."
              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TAILSCALE CONNECTED"
          Write-Host "IP: $tailscaleIP"
          Write-Host "=========================================="

          "TAILSCALE_IP=$tailscaleIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==========================================
      # 6. INSTALL PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================
      # 7. INSTALL NOVNC
      # ==========================================
      - name: Install noVNC
        shell: powershell
        run: |

          $noVNC = "C:\noVNC"

          if (Test-Path $noVNC) {

              Remove-Item `
                $noVNC `
                -Recurse `
                -Force
          }

          Write-Host "Downloading noVNC..."

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $noVNC

          if (-not (Test-Path "$noVNC\vnc.html")) {

              Write-Error "noVNC installation failed."
              exit 1
          }

          Write-Host "noVNC installed."


      # ==========================================
      # 8. INSTALL WEBSOCKIFY
      # ==========================================
      - name: Install Websockify
        shell: powershell
        run: |

          Write-Host "Installing websockify..."

          python -m pip install --upgrade pip

          python -m pip install websockify

          if ($LASTEXITCODE -ne 0) {

              Write-Error "websockify installation failed."
              exit 1
          }

          Write-Host "websockify installed."


      # ==========================================
      # 9. START NOVNC
      # ==========================================
      - name: Start noVNC
        shell: powershell
        run: |

          $logFile = "C:\noVNC\novnc.log"
          $errorFile = "C:\noVNC\novnc-error.log"

          Remove-Item `
            $logFile `
            -Force `
            -ErrorAction SilentlyContinue

          Remove-Item `
            $errorFile `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Starting websockify..."
          Write-Host "VNC target: 127.0.0.1:5900"
          Write-Host "Web port: 6080"

          $process = Start-Process `
            -FilePath "python.exe" `
            -ArgumentList @(
                "-m"
                "websockify"
                "--web=C:\noVNC"
                "0.0.0.0:6080"
                "127.0.0.1:5900"
            ) `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errorFile `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "Websockify PID: $($process.Id)"

          Start-Sleep 10

          # Check process
          $running = Get-Process `
            -Id $process.Id `
            -ErrorAction SilentlyContinue

          if (-not $running) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "WEBSOCKIFY PROCESS DIED"
              Write-Host "=========================================="

              if (Test-Path $errorFile) {

                  Write-Host ""
                  Write-Host "===== ERROR LOG ====="

                  Get-Content $errorFile
              }

              if (Test-Path $logFile) {

                  Write-Host ""
                  Write-Host "===== OUTPUT LOG ====="

                  Get-Content $logFile
              }

              exit 1
          }

          Write-Host "Websockify process is running."

          # Check port 6080
          $novncPort = Get-NetTCPConnection `
            -LocalPort 6080 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $novncPort) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "PORT 6080 IS NOT LISTENING"
              Write-Host "=========================================="

              Write-Host ""
              Write-Host "===== ERROR LOG ====="

              if (Test-Path $errorFile) {
                  Get-Content $errorFile
              }

              Write-Host ""
              Write-Host "===== OUTPUT LOG ====="

              if (Test-Path $logFile) {
                  Get-Content $logFile
              }

              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "NOVNC IS RUNNING"
          Write-Host "PORT 6080 OK"
          Write-Host "=========================================="


      # ==========================================
      # 10. TEST CONNECTION
      # ==========================================
      - name: Test noVNC
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "Testing VNC port..."

          $vnc = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $vnc.TcpTestSucceeded) {

              Write-Error "VNC port 5900 is unavailable."
              exit 1
          }

          Write-Host "VNC 5900 OK."

          Write-Host ""
          Write-Host "Testing noVNC port..."

          $novnc = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $novnc.TcpTestSucceeded) {

              Write-Error "noVNC port 6080 is unavailable."
              exit 1
          }

          Write-Host "noVNC 6080 OK."


      # ==========================================
      # 11. SHOW CONNECTION
      # ==========================================
      - name: Show Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              NOVNC READY"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"

          Write-Host ""

          Write-Host "Open this URL:"
          Write-Host "http://$env:TAILSCALE_IP`:6080/vnc.html"

          Write-Host ""

          Write-Host "VNC:"
          Write-Host "$env:TAILSCALE_IP`:5900"

          Write-Host ""

          Write-Host "=========================================="


      # ==========================================
      # 12. MAINTAIN CONNECTION
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          NOVNC SESSION ACTIVE"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"

          Write-Host ""

          Write-Host "Browser URL:"
          Write-Host "http://$env:TAILSCALE_IP`:6080/vnc.html"

          Write-Host ""

          Write-Host "=========================================="

          while ($true) {

              # --------------------------------------
              # TAILSCALE CHECK
              # --------------------------------------

              $tsIP = & "$env:TAILSCALE" ip -4 2>$null |
                Select-Object -First 1

              if ($tsIP) {
                  Write-Host "$(Get-Date -Format 'HH:mm:ss') - Tailscale OK: $tsIP"
              }
              else {
                  Write-Host "$(Get-Date -Format 'HH:mm:ss') - WARNING: Tailscale unavailable"
              }


              # --------------------------------------
              # VNC CHECK
              # --------------------------------------

              $vncPort = Get-NetTCPConnection `
                -LocalPort 5900 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($vncPort) {
                  Write-Host "VNC :5900 OK"
              }
              else {
                  Write-Host "WARNING: VNC :5900 NOT LISTENING"
              }


              # --------------------------------------
              # NOVNC CHECK
              # --------------------------------------

              $novncPort = Get-NetTCPConnection `
                -LocalPort 6080 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($novncPort) {

                  Write-Host "noVNC :6080 OK"

              }
              else {

                  Write-Host ""
                  Write-Host "WARNING: noVNC :6080 NOT LISTENING"

                  if (Test-Path "C:\noVNC\novnc-error.log") {

                      Write-Host ""
                      Write-Host "===== noVNC ERROR ====="

                      Get-Content `
                        "C:\noVNC\novnc-error.log" `
                        -Tail 20
                  }
              }


              Write-Host ""

              Start-Sleep 60
          }

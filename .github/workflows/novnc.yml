name: noVNC

on:
  workflow_dispatch:

jobs:
  secure-novnc:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ============================================================
      # 1. CREATE WINDOWS USER
      # ============================================================
      - name: Create Remote User
        shell: powershell
        run: |
          $username = "VNC"
          $password = "Password123"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser `
            -Name $username `
            -ErrorAction SilentlyContinue

          if ($existing) {
              Write-Host "User already exists. Resetting password..."
              Set-LocalUser `
                -Name $username `
                -Password $securePassword
          }
          else {
              Write-Host "Creating user..."

              New-LocalUser `
                -Name $username `
                -Password $securePassword `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          # Administrator access
          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Write-Host "User created:"
          Write-Host "Username: $username"


      # ============================================================
      # 2. INSTALL TIGHTVNC
      # ============================================================
      - name: Install TightVNC
        shell: powershell
        run: |

          $url = "https://www.tightvnc.com/download/2.8.88/tightvnc-2.8.88-gpl-setup-64bit.msi"

          $installer = "$env:TEMP\tightvnc.msi"

          Write-Host "Downloading TightVNC..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
              Write-Error "TightVNC installer was not downloaded."
              exit 1
          }

          Write-Host "Installing TightVNC..."

          # TightVNC MSI configuration
          #
          # Password:
          # Password123
          #
          # VNC port:
          # 5900

          $arguments = @(
              "/i"
              "`"$installer`""
              "/quiet"
              "/norestart"

              "SET_USEVNCAUTHENTICATION=1"
              "VALUE_OF_USEVNCAUTHENTICATION=1"

              "SET_PASSWORD=1"
              "VALUE_OF_PASSWORD=Password123"

              "SET_USECONTROLAUTHENTICATION=1"
              "VALUE_OF_USECONTROLAUTHENTICATION=1"

              "SET_CONTROLPASSWORD=1"
              "VALUE_OF_CONTROLPASSWORD=Password123"
          )

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($process.ExitCode)"

          if ($process.ExitCode -ne 0) {
              Write-Error "TightVNC installation failed."
              exit 1
          }

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          Write-Host "TightVNC installed."


      # ============================================================
      # 3. FIND TIGHTVNC
      # ============================================================
      - name: Locate TightVNC
        shell: powershell
        run: |

          $paths = @(
              "${env:ProgramFiles}\TightVNC\tvnserver.exe",
              "${env:ProgramFiles(x86)}\TightVNC\tvnserver.exe"
          )

          $tvnserver = $null

          foreach ($path in $paths) {
              if (Test-Path $path) {
                  $tvnserver = $path
                  break
              }
          }

          if (-not $tvnserver) {
              Write-Error "tvnserver.exe was not found."
              exit 1
          }

          Write-Host "TightVNC:"
          Write-Host $tvnserver

          echo "TVNSERVER=$tvnserver" >> $env:GITHUB_ENV


      # ============================================================
      # 4. START TIGHTVNC
      # ============================================================
      - name: Start VNC Server
        shell: powershell
        run: |

          Write-Host "Starting TightVNC service..."

          $service = Get-Service `
            -Name "tvnserver" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Write-Host "TightVNC service found."

              if ($service.Status -ne "Running") {

                  Start-Service `
                    -Name "tvnserver"

                  Start-Sleep 5
              }

          }
          else {

              Write-Host "Service not found."

              # Start server directly
              Start-Process `
                -FilePath "$env:TVNSERVER" `
                -ArgumentList "-start" `
                -WindowStyle Hidden

              Start-Sleep 5
          }

          # Reload configuration
          & "$env:TVNSERVER" -reload 2>$null

          Start-Sleep 3

          Write-Host "TightVNC started."


      # ============================================================
      # 5. VERIFY VNC
      # ============================================================
      - name: Verify VNC
        shell: powershell
        run: |

          Write-Host "Checking VNC port 5900..."

          $result = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 5900 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "VNC port 5900 is NOT available."
              Write-Host ""

              Get-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              exit 1
          }

          Write-Host "VNC port 5900 is OK."


      # ============================================================
      # 6. INSTALL PYTHON
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ============================================================
      # 7. INSTALL WEBSOCKIFY
      # ============================================================
      - name: Install Websockify
        shell: powershell
        run: |

          python -m pip install --upgrade pip

          python -m pip install websockify

          Write-Host "Checking websockify..."

          python -m websockify --help

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Websockify installation failed."
              exit 1
          }

          Write-Host "Websockify installed."


      # ============================================================
      # 8. DOWNLOAD NOVNC
      # ============================================================
      - name: Install noVNC
        shell: powershell
        run: |

          $noVNC = "C:\noVNC"

          if (Test-Path $noVNC) {
              Remove-Item `
                $noVNC `
                -Recurse `
                -Force
          }

          Write-Host "Downloading noVNC..."

          git clone `
            --depth 1 `
            https://github.com/novnc/noVNC.git `
            $noVNC

          if (-not (Test-Path "$noVNC\vnc.html")) {
              Write-Error "noVNC installation failed."
              exit 1
          }

          Write-Host "noVNC installed."


      # ============================================================
      # 9. CONFIGURE FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: powershell
        run: |

          Write-Host "Configuring firewall..."

          # Remove old rules
          netsh advfirewall firewall delete rule `
            name="noVNC-Tailscale" `
            2>$null

          netsh advfirewall firewall delete rule `
            name="VNC-Tailscale" `
            2>$null

          # VNC
          netsh advfirewall firewall add rule `
            name="VNC-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=5900

          # noVNC
          netsh advfirewall firewall add rule `
            name="noVNC-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=6080

          Write-Host "Firewall configured."


      # ============================================================
      # 10. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"

          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installer

          Start-Process `
            msiexec.exe `
            -ArgumentList @(
              "/i"
              "`"$installer`""
              "/quiet"
              "/norestart"
            ) `
            -Wait

          Remove-Item `
            $installer `
            -Force `
            -ErrorAction SilentlyContinue

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          echo "TAILSCALE=$tailscale" >> $env:GITHUB_ENV

          Write-Host "Tailscale installed."


      # ============================================================
      # 11. CONNECT TAILSCALE
      # ============================================================
      - name: Establish Tailscale Connection
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale = "$env:TAILSCALE"

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-novnc-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Waiting for Tailscale IP..."

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {

              $tsIP = (
                & $tailscale ip -4 2>$null |
                Select-Object -First 1
              ).Trim()

              if ($tsIP -match '^\d+\.\d+\.\d+\.\d+$') {
                  break
              }

              Start-Sleep 3
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP was not assigned."
              exit 1
          }

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "========================================"
          Write-Host " TAILSCALE CONNECTED"
          Write-Host " IP: $tsIP"
          Write-Host "========================================"


      # ============================================================
      # 12. START NOVNC
      # ============================================================
      - name: Start noVNC
        shell: powershell
        run: |

          $logFile = "C:\noVNC\websockify.log"

          Write-Host "Starting noVNC..."

          # IMPORTANT:
          #
          # 6080 = browser / WebSocket
          # 5900 = TightVNC
          #
          # noVNC static files are served from C:\noVNC

          $arguments = @(
              "-m"
              "websockify"
              "--web=C:\noVNC"
              "0.0.0.0:6080"
              "127.0.0.1:5900"
          )

          Start-Process `
            -FilePath "python" `
            -ArgumentList $arguments `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError "C:\noVNC\websockify-error.log" `
            -WindowStyle Hidden

          Start-Sleep 8

          Write-Host "Checking noVNC..."

          $result = Test-NetConnection `
            -ComputerName 127.0.0.1 `
            -Port 6080 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {

              Write-Host ""
              Write-Host "noVNC failed to start."
              Write-Host ""

              if (Test-Path $logFile) {
                  Get-Content $logFile
              }

              if (Test-Path "C:\noVNC\websockify-error.log") {
                  Get-Content "C:\noVNC\websockify-error.log"
              }

              exit 1
          }

          Write-Host "noVNC is running."


      # ============================================================
      # 13. TEST TAILSCALE ACCESS
      # ============================================================
      - name: Verify noVNC
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "             noVNC READY"
          Write-Host "========================================"
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host $env:TAILSCALE_IP

          Write-Host ""

          Write-Host "Browser:"
          Write-Host "http://$env:TAILSCALE_IP:6080/vnc.html"

          Write-Host ""

          Write-Host "VNC:"
          Write-Host "$env:TAILSCALE_IP`:5900"

          Write-Host ""

          Write-Host "VNC Password:"
          Write-Host "Password123"

          Write-Host ""
          Write-Host "========================================"


      # ============================================================
      # 14. MAINTAIN CONNECTION
      # ============================================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "========================================"
          Write-Host "        noVNC SESSION ACTIVE"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "URL:"
          Write-Host "http://$env:TAILSCALE_IP:6080/vnc.html"
          Write-Host ""
          Write-Host "Username:"
          Write-Host "VNC"
          Write-Host ""
          Write-Host "Password:"
          Write-Host "Password123"
          Write-Host ""
          Write-Host "========================================"

          while ($true) {

              # Keep Tailscale alive
              & "$env:TAILSCALE" status 2>$null

              # Keep VNC service alive
              $vncService = Get-Service `
                -Name "tvnserver" `
                -ErrorAction SilentlyContinue

              if ($vncService) {

                  if ($vncService.Status -ne "Running") {

                      Write-Host "TightVNC stopped. Restarting..."

                      Start-Service `
                        -Name "tvnserver" `
                        -ErrorAction SilentlyContinue
                  }
              }

              # Keep noVNC alive
              $port = Get-NetTCPConnection `
                -LocalPort 6080 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if (-not $port) {

                  Write-Host "noVNC stopped. Restarting..."

                  Start-Process `
                    -FilePath "python" `
                    -ArgumentList @(
                      "-m"
                      "websockify"
                      "--web=C:\noVNC"
                      "0.0.0.0:6080"
                      "127.0.0.1:5900"
                    ) `
                    -WindowStyle Hidden
              }

              Start-Sleep 60
          }

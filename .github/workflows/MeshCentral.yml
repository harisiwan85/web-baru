name: MeshCentral

on:
  workflow_dispatch:

jobs:
  meshcentral:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      # ==========================================
      # 1. SETUP NODE.JS
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ==========================================
      # 2. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          if (-not (Test-Path $installer)) {
              Write-Error "Tailscale download failed."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          $p = Start-Process `
            msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait `
            -PassThru

          Write-Host "MSI exit code: $($p.ExitCode)"

          Remove-Item $installer -Force

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "tailscale.exe not found."
              exit 1
          }

          "TAILSCALE=$tailscale" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          Write-Host "Tailscale installed."


      # ==========================================
      # 3. CONNECT TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not $env:TAILSCALE_AUTH_KEY) {
              Write-Error "TAILSCALE_AUTH_KEY secret is empty."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-meshcentral-$env:GITHUB_RUN_ID"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Write-Host "Tailscale connected."

          $tailscaleIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $addresses = & $tailscale ip -4 2>$null

              foreach ($address in $addresses) {

                  $address = $address.Trim()

                  if ($address -match '^100\.\d+\.\d+\.\d+$') {
                      $tailscaleIP = $address
                      break
                  }
              }

              if ($tailscaleIP) {
                  break
              }

              Start-Sleep 2
          }

          if (-not $tailscaleIP) {

              Write-Host ""
              Write-Host "Tailscale status:"
              & $tailscale status

              Write-Error "Tailscale IP not found."
              exit 1
          }

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "TAILSCALE READY"
          Write-Host "IP: $tailscaleIP"
          Write-Host "=========================================="

          "TAILSCALE_IP=$tailscaleIP" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append


      # ==========================================
      # 4. INSTALL MESHCENTRAL
      # ==========================================
      - name: Install MeshCentral
        shell: powershell
        run: |

          $meshDir = "C:\MeshCentral"

          if (Test-Path $meshDir) {
              Remove-Item `
                $meshDir `
                -Recurse `
                -Force
          }

          New-Item `
            -ItemType Directory `
            -Path $meshDir `
            -Force | Out-Null

          Set-Location $meshDir

          Write-Host "Installing MeshCentral..."

          npm install meshcentral

          if ($LASTEXITCODE -ne 0) {
              Write-Error "MeshCentral installation failed."
              exit 1
          }

          Write-Host "MeshCentral installed."

          Write-Host ""
          Write-Host "MeshCentral version:"

          node node_modules\meshcentral --version


      # ==========================================
      # 5. CREATE MESHCENTRAL CONFIG
      # ==========================================
      - name: Configure MeshCentral
        shell: powershell
        run: |

          $meshDir = "C:\MeshCentral"

          $config = @'
{
  "settings": {
    "Cert": "localhost",
    "Port": 4430,
    "AliasPort": 4430,
    "WANonly": false,
    "Minify": true,
    "WebRTC": true
  },
  "domains": {
    "": {
      "Title": "GitHub MeshCentral",
      "Title2": "Remote Desktop",
      "NewAccounts": true,
      "UserNameIsEmail": false
    }
  }
}
'@

          $configPath = "$meshDir\meshcentral-data\config.json"

          New-Item `
            -ItemType Directory `
            -Path "$meshDir\meshcentral-data" `
            -Force | Out-Null

          Set-Content `
            -Path $configPath `
            -Value $config `
            -Encoding UTF8

          Write-Host "MeshCentral config created."

          Get-Content $configPath


      # ==========================================
      # 6. FIREWALL
      # ==========================================
      - name: Configure Firewall
        shell: powershell
        run: |

          netsh advfirewall firewall delete rule `
            name="MeshCentral-Tailscale" `
            2>$null

          netsh advfirewall firewall add rule `
            name="MeshCentral-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=4430

          Write-Host "Firewall configured."


      # ==========================================
      # 7. START MESHCENTRAL
      # ==========================================
      - name: Start MeshCentral
        shell: powershell
        run: |

          $meshDir = "C:\MeshCentral"

          Set-Location $meshDir

          Write-Host "Starting MeshCentral..."

          $process = Start-Process `
            -FilePath "node.exe" `
            -ArgumentList "node_modules\meshcentral" `
            -WorkingDirectory $meshDir `
            -WindowStyle Hidden `
            -PassThru

          Write-Host "MeshCentral PID: $($process.Id)"

          Start-Sleep 15

          $running = Get-Process `
            -Id $process.Id `
            -ErrorAction SilentlyContinue

          if (-not $running) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "MESHCENTRAL PROCESS STOPPED"
              Write-Host "=========================================="

              exit 1
          }

          Write-Host "MeshCentral process is running."


      # ==========================================
      # 8. CHECK MESHCENTRAL PORT
      # ==========================================
      - name: Verify MeshCentral
        shell: powershell
        run: |

          Write-Host "Checking MeshCentral port 4430..."

          $port = Get-NetTCPConnection `
            -LocalPort 4430 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $port) {

              Write-Host ""
              Write-Host "=========================================="
              Write-Host "MESHCENTRAL PORT 4430 NOT LISTENING"
              Write-Host "=========================================="

              exit 1
          }

          Write-Host "MeshCentral port 4430 OK."


      # ==========================================
      # 9. SHOW CONNECTION
      # ==========================================
      - name: Show Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       MESHCENTRAL IS READY"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host "$env:TAILSCALE_IP"

          Write-Host ""

          Write-Host "Open in browser:"
          Write-Host "https://$env:TAILSCALE_IP`:4430"

          Write-Host ""

          Write-Host "=========================================="


      # ==========================================
      # 10. MAINTAIN CONNECTION
      # ==========================================
      - name: Maintain Connection
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "       MESHCENTRAL SESSION ACTIVE"
          Write-Host "=========================================="
          Write-Host ""

          Write-Host "URL:"
          Write-Host "https://$env:TAILSCALE_IP`:4430"

          Write-Host ""

          while ($true) {

              $port = Get-NetTCPConnection `
                -LocalPort 4430 `
                -State Listen `
                -ErrorAction SilentlyContinue

              if ($port) {
                  Write-Host "$(Get-Date -Format 'HH:mm:ss') - MeshCentral :4430 OK"
              }
              else {
                  Write-Host "$(Get-Date -Format 'HH:mm:ss') - WARNING: MeshCentral :4430 NOT LISTENING"
              }

              $ts = & "$env:TAILSCALE" ip -4 2>$null |
                Select-Object -First 1

              if ($ts) {
                  Write-Host "Tailscale: $ts"
              }
              else {
                  Write-Host "WARNING: Tailscale IP unavailable"
              }

              Start-Sleep 60
          }

name: Windows crd

on:
  workflow_dispatch:
    inputs:
      auth_code:
        description: 'Chrome Remote Desktop Auth Code (copy dari CRD)'
        required: true
        type: string
      pin_code:
        description: 'PIN Code (6 digit)'
        required: true
        type: string
        default: '123456'

jobs:
  windows-rdp:
    runs-on: windows-latest
    timeout-minutes: 360
    
    steps:
      - name: Setup Chrome Remote Desktop
        shell: pwsh
        run: |
          # Download Chrome Remote Desktop installer
          $url = "https://dl.google.com/dl/cloudsdk/channels/rapid/GoogleChromeRemoteDesktopHost.exe"
          $installer = "$env:TEMP\chromeremotedesktop.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          
          # Install silently
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          
          # Setup Chrome Remote Desktop dengan auth code
          $authCode = "${{ github.event.inputs.auth_code }}"
          $pinCode = "${{ github.event.inputs.pin_code }}"
          
          # HAPUS bagian "--start" dari auth code jika ada
          $authCode = $authCode -replace "--start", ""
          $authCode = $authCode.Trim()
          
          # Jika auth code masih mengandung perintah lengkap, ekstrak hanya code-nya
          if ($authCode -match '--code="([^"]+)"') {
              $authCode = $Matches[1]
          }
          
          # Path ke executable CRD
          $crdPath = "${Env:PROGRAMFILES(X86)}\Google\Chrome Remote Desktop\CurrentVersion\remoting_start_host.exe"
          
          # Jalankan perintah auth - GABUNGKAN path dan argumen
          & $crdPath --code="$authCode" --redirect-url="https://remotedesktop.google.com/_/oauthredirect" --name="$env:COMPUTERNAME"
          
          # Setup PIN
          & $crdPath --pin="$pinCode"
          
          Write-Host "Chrome Remote Desktop siap!"
          
      - name: Display Connection Info
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "RDP VIA CHROME REMOTE DESKTOP READY"
          Write-Host "========================================"
          Write-Host ""
          Write-Host "1. Buka https://remotedesktop.google.com/access"
          Write-Host "2. Login dengan akun Google yang sama"
          Write-Host "3. Cari komputer dengan nama: $env:COMPUTERNAME"
          Write-Host "4. Gunakan PIN: ${{ github.event.inputs.pin_code }}"
          Write-Host ""
          Write-Host "Session aktif selama 6 jam (maksimal)"
          Write-Host "========================================"
          
      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "Menjaga sesi tetap aktif..."
          while ($true) {
            Write-Host "Sesi aktif - $(Get-Date)"
            Start-Sleep -Seconds 300
          }
